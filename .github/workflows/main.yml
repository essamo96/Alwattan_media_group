name: 🚀 نشر الموقع على السيرفر

# النشر عبر SSH لا FTP: السيرفر يسحب نفس الـ commit من GitHub، فيصبح
# الكود المحلي والمستودع والسيرفر متطابقة بحكم التصميم لا بالمزامنة.
# النسخة السابقة كانت تعتمد SamKirkland/FTP-Deploy-Action وتنهار عند اول
# عملية حذف لا تطابق ملف الحالة (خطأ 550 على database/seeds).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_migrations:
        description: تشغيل ترحيلات قاعدة البيانات
        type: boolean
        default: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 🎉 تنفيذ النشر
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: 🚀 سحب الكود وتجهيز التطبيق على السيرفر
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "::group::سحب الكود"
            # التهيئة الاولى: مجلد النشر لم يكن مستودع git، فننشئه فوق الملفات
            # الموجودة. git init لا يمس اي ملف، و reset لاحقا يستبدل المتعقَّب فقط.
            if [ ! -d .git ]; then
              echo "المجلد ليس مستودع git — تهيئة اولى"
              git init
            fi

            # بصمة composer.lock قبل السحب، لتقرير الحاجة الى composer install.
            # نعتمد البصمة لا تاريخ git كي تعمل حتى في التهيئة الاولى.
            LOCK_BEFORE=$(md5sum composer.lock 2>/dev/null | cut -d' ' -f1 || echo none)

            # التوكن قصير العمر يصدره GitHub لهذا التشغيل فقط، ولا يُخزَّن على
            # السيرفر: لا نضعه في remote بل نمرره لعملية fetch وحدها. يعمل مع
            # المستودعات الخاصة والعامة على السواء.
            git fetch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
            git reset --hard FETCH_HEAD
            git branch -f main FETCH_HEAD 2>/dev/null || true
            git symbolic-ref HEAD refs/heads/main 2>/dev/null || true
            git log -1 --oneline
            echo "::endgroup::"

            echo "::group::المكتبات"
            # composer install بطيء، فيُشغَّل فقط عند تغير الاعتماديات او غياب vendor
            LOCK_AFTER=$(md5sum composer.lock | cut -d' ' -f1)
            if [ "$LOCK_BEFORE" != "$LOCK_AFTER" ] || [ ! -d vendor ]; then
              composer install --no-dev --optimize-autoloader --no-interaction
            else
              echo "لا تغيير في composer — تخطي"
            fi
            echo "::endgroup::"

            echo "::group::مسح الكاش"
            # كاش الحزم المُجمَّع اولا: نسخة قديمة منه تعطل الاقلاع بالكامل
            # (خطأ Fideloper\Proxy\TrustedProxyServiceProvider not found)
            rm -f bootstrap/cache/*.php
            php artisan cache:clear
            php artisan view:clear
            php artisan config:clear
            php artisan route:clear
            php artisan package:discover
            echo "::endgroup::"

            echo "::group::قاعدة البيانات"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_migrations }}" != "true" ]; then
              echo "تم تخطي الترحيلات بناء على الطلب"
            else
              # كل الترحيلات محمية بـ hasTable / hasColumn فلا اثر لها على الجداول القائمة.
              # لا نشغّل db:seed هنا اطلاقا: AdminUserSeeder يعيد تعيين كلمة مرور المدير.
              php artisan migrate --force
            fi
            echo "::endgroup::"

            echo "::group::الصلاحيات"
            chmod -R 775 storage bootstrap/cache
            if [ -d public/uploads ]; then chmod -R 775 public/uploads; fi
            echo "::endgroup::"

      - name: ✅ التحقق من استجابة الموقع
        run: |
          for i in 1 2 3; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 30 https://www.alwattanmediagroup.com/ || echo 000)
            echo "المحاولة $i: HTTP $code"
            case "$code" in
              200|301|302) echo "✅ الموقع يستجيب"; exit 0 ;;
            esac
            sleep 15
          done
          echo "❌ الموقع لا يستجيب — راجع storage/logs/laravel.log على السيرفر"
          exit 1
