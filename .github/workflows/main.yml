name: 🚀 Deploy Website to YMC

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Running Deployment Process
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 📂 Sync files to Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: 147.93.54.90
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          server-dir: ./
          # storage/ و public/uploads/ غير متعقَّبين في git (مستثنيان في gitignore)، فلا
          # يصلان اطلاقا في الكود المسحوب لهذه الورشة. بدون استثنائهما تحذفهما الاداة من
          # السيرفر عند اول مزامنة ناجحة: فقدان صور الشركاء والاخبار المرفوعة فعليا،
          # وتعطل الموقع (storage يحوي السجلات والجلسات وكاش الواجهات).
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            public/uploads/**
            storage/**
            .env
            .env.example
            phpunit.xml
            README.md
            docker-compose.yml
            docker-compose.override.yml
            .editorconfig
            .styleci.yml

      - name: 🧹 Clear stale compiled cache on server
        # storage/ is intentionally excluded from the FTP sync above, so compiled
        # Blade views/config/cache from before this deploy would otherwise linger
        # forever and keep serving old code (this caused the file manager 500 error).
        # Falls back to the default token baked into config/app.php when the
        # DEPLOY_CACHE_TOKEN secret hasn't been set yet.
        run: |
          TOKEN="${{ secrets.DEPLOY_CACHE_TOKEN }}"
          TOKEN="${TOKEN:-lfm-deploy-clear-2026}"
          curl -fsS "https://alwattanmediagroup.com/deploy/clear-cache/$TOKEN"
